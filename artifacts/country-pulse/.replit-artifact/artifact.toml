kind = "mobile"
previewPath = "/"
title = "Country Pulse"
description = "An Android-first country explorer that lets people browse every country and tap one to read the latest related headlines in a focused, readable news view."
version = "1.0.0"
id = "artifacts/country-pulse"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 22904

[services.development]
run = "pnpm --filter @workspace/country-pulse run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/country-pulse", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/country-pulse", "run", "serve" ]

[services.env]
PORT = "22904"
BASE_PATH = "/"
